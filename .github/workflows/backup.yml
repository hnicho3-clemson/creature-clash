# Daily database backup.
# Copies the whole Neon database with pg_dump, encrypts it with your passphrase, and keeps it for 30 days
# as a download on this workflow's run page (GitHub > Actions > Daily database backup).
# Setup and restore steps are in the README under "Backups".
name: Daily database backup

on:
  schedule:
    - cron: '17 7 * * *'   # every day at 07:17 UTC (about 3 AM Eastern)
  workflow_dispatch:        # lets you run a backup by hand from the Actions tab

permissions:
  contents: read

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Check the secrets are set
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error::Add DATABASE_URL and BACKUP_PASSPHRASE under Settings > Secrets and variables > Actions. See the README's Backups section."
            exit 1
          fi
          if [ "${#BACKUP_PASSPHRASE}" -lt 20 ]; then
            echo "::error::BACKUP_PASSPHRASE should be at least 20 characters."
            exit 1
          fi

      - name: Install a pg_dump that matches the database
        run: |
          major=$(psql "$DATABASE_URL" -Atc "SELECT current_setting('server_version_num')::int / 10000")
          echo "Database is Postgres $major"
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common >/dev/null
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y >/dev/null
          sudo apt-get install -y -qq "postgresql-client-$major" >/dev/null
          echo "PGBIN=/usr/lib/postgresql/$major/bin" >> "$GITHUB_ENV"

      - name: Dump, check and encrypt
        run: |
          set -euo pipefail
          umask 077
          name="creature-clash-$(date -u +%Y-%m-%d-%H%M).dump"
          "$PGBIN/pg_dump" --format=custom --no-owner --no-privileges --file "$name" "$DATABASE_URL"
          # Make sure the dump can be read back and holds the main tables before keeping it.
          "$PGBIN/pg_restore" --list "$name" > contents.txt
          for t in users saves matches; do grep -q "TABLE public $t " contents.txt || { echo "::error::Backup is missing table $t"; exit 1; }; done
          gpg --batch --yes --quiet --pinentry-mode loopback --passphrase-fd 3 \
              --symmetric --cipher-algo AES256 --output "$name.gpg" "$name" 3<<<"$BACKUP_PASSPHRASE"
          shred -u "$name" contents.txt
          echo "BACKUP_FILE=$name.gpg" >> "$GITHUB_ENV"
          ls -lh "$name.gpg"

      - name: Keep the encrypted backup for 30 days
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BACKUP_FILE }}
          path: ${{ env.BACKUP_FILE }}
          retention-days: 30
          if-no-files-found: error
          compression-level: 0
